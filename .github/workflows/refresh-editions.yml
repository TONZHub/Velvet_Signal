name: Refresh Velvet Signal editions

on:
  schedule:
    - cron: "17 */8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: velvet-signal-scout
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Scout and compose public desks
        run: npm run scout
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          VELVET_PUBLIC_URL: https://velvetsignal.lol
      - name: Publish changed editions
        run: |
          if git diff --quiet -- data/generated-issues.json; then
            echo "No material source changes; nothing to publish."
            exit 0
          fi
          git config user.name "velvet-signal-scout[bot]"
          git config user.email "velvet-signal-scout[bot]@users.noreply.github.com"
          git add data/generated-issues.json
          git commit -m "Refresh Velvet Signal editions"
          git push
