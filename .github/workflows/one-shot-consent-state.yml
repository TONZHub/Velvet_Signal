name: One-shot consent state patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-consent-state.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace consent refusal with explicit state
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('public/index.html')
          text = index.read_text()
          old = '            if (!delivery) return toolResponse({ error: "Human approval required. Ask the human to inspect and approve this exact patch in Velvet Signal.", delivered: false, patch_id: patchId });'
          new = '''            if (!delivery) return toolResponse({
              status: "awaiting_human_consent",
              delivered: false,
              patch_id: patchId,
              reason: "Velvet Signal will not deliver a memory patch until a person inspects and releases this exact ID.",
              next_step: `Ask the person on this page to open ${patchId} and approve it. Then call apply_memory_patch again.`,
              agent_must_not: "Do not retry in a loop. Do not treat this as a tool failure."
            });'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one consent refusal, found {text.count(old)}')
          index.write_text(text.replace(old, new))

          readme = Path('README.md')
          text = readme.read_text()
          old = '3. If `apply_memory_patch` runs before release, Velvet Signal refuses delivery with **Human approval required**. This refusal is the intended product behavior.'
          new = '3. If `apply_memory_patch` runs before release, Velvet Signal returns **`status: awaiting_human_consent`** with `delivered: false`, the exact patch ID, a human-facing next step, and an instruction not to retry in a loop. This is an intended consent state, not a tool error.'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one README judge-flow line, found {text.count(old)}')
          readme.write_text(text.replace(old, new))
          PY
      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/one-shot-consent-state.yml
          git add public/index.html README.md .github/workflows/one-shot-consent-state.yml
          git commit -m "Clarify WebMCP human consent state"
          git push origin main
